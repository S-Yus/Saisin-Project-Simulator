<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 800" width="1200" height="800" font-family="'Hiragino Sans','Yu Gothic UI','Yu Gothic','Meiryo',sans-serif">
  <defs>
    <marker id="ar" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#3d4650"/></marker>
    <marker id="arb" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0L10 5L0 10z" fill="#1a56c4"/></marker>
    <style>
      .t{font-size:15px;fill:#1c2430;font-weight:700}
      .s{font-size:12px;fill:#4a5560}
      .xs{font-size:11px;fill:#5b6670}
      .g{font-size:13px;fill:#3d4650;font-weight:700}
      .lab{font-size:12px;fill:#1a56c4;font-weight:700}
      .box{fill:#fff;stroke:#9aa4ae;stroke-width:1.2}
      .mod{fill:#e8f4ee;stroke:#00754a;stroke-width:1.2}
      .net{fill:#eaf1fb;stroke:#1a56c4;stroke-width:1.2}
      .grp{fill:#f6f7f8;stroke:#c4cbd2;stroke-width:1.2}
      .proc{fill:#fbfdfc;stroke:#00754a;stroke-width:1.6;stroke-dasharray:6 4}
      .ln{stroke:#3d4650;stroke-width:1.5;fill:none}
      .lnb{stroke:#1a56c4;stroke-width:2;fill:none}
    </style>
  </defs>
  <rect width="1200" height="800" fill="#ffffff"/>
  <text x="30" y="38" style="font-size:22px;font-weight:700;fill:#1c2430">資産形成シミュレーター　アーキテクチャ図</text>
  <text x="30" y="60" class="s">アプリ 0.11.1／確認用環境（staging）の実際の配置。外部の認証基盤・解析・CDN・npm 依存パッケージは使っていない</text>

  <!-- 利用者 -->
  <rect x="30" y="85" width="210" height="290" rx="10" class="grp"/>
  <text x="46" y="108" class="g">利用者</text>
  <rect x="48" y="122" width="174" height="92" rx="8" class="box"/>
  <text x="62" y="148" class="t">参加者</text>
  <text x="62" y="168" class="s">スマートフォンのブラウザー</text>
  <text x="62" y="186" class="xs">QRコードで参加・アプリ不要</text>
  <text x="62" y="202" class="xs">参加トークン（端末に保存）</text>
  <rect x="48" y="232" width="174" height="92" rx="8" class="box"/>
  <text x="62" y="258" class="t">管理者</text>
  <text x="62" y="278" class="s">パソコンのブラウザー（/admin）</text>
  <text x="62" y="296" class="xs">ID・パスワードでログイン</text>
  <text x="62" y="312" class="xs">説明会の作成・QR表示・停止</text>

  <!-- Cloudflare -->
  <rect x="300" y="122" width="190" height="202" rx="10" class="net"/>
  <text x="316" y="150" class="t">Cloudflare</text>
  <text x="316" y="172" class="s">HTTPS の終端</text>
  <text x="316" y="192" class="s">staging.nisa-simulator.app</text>
  <text x="316" y="220" class="xs">証明書・DNS を管理</text>
  <text x="316" y="238" class="xs">VPS の IP を外に出さない</text>

  <line x1="222" y1="168" x2="298" y2="190" class="lnb" marker-end="url(#arb)"/>
  <line x1="222" y1="278" x2="298" y2="256" class="lnb" marker-end="url(#arb)"/>
  <text x="236" y="166" class="lab">HTTPS</text>
  <text x="236" y="298" class="lab">HTTPS</text>

  <!-- VPS -->
  <rect x="540" y="85" width="630" height="440" rx="12" class="grp"/>
  <text x="558" y="108" class="g">さくらのVPS（石狩・1G・Ubuntu 24.04）</text>
  <text x="558" y="126" class="xs">パケットフィルター: SSH（22）だけ許可。HTTP の入口は開けていない</text>

  <rect x="560" y="190" width="160" height="80" rx="8" class="net"/>
  <text x="574" y="216" class="t">cloudflared</text>
  <text x="574" y="236" class="s">トンネルの接続口</text>
  <text x="574" y="254" class="xs">systemd --user</text>

  <path d="M490 222 L558 222" class="lnb" marker-end="url(#arb)"/>
  <path d="M558 240 L492 240" class="lnb" stroke-dasharray="5 4" marker-end="url(#arb)"/>
  <text x="494" y="214" class="xs">要求</text>
  <text x="494" y="258" class="xs">外向きに接続</text>

  <!-- Node プロセス -->
  <rect x="745" y="140" width="410" height="250" rx="10" class="proc"/>
  <text x="760" y="160" class="g" style="fill:#00754a">Node.js 24.11.1　単一プロセス（127.0.0.1:8080・systemd --user）</text>

  <rect x="760" y="172" width="380" height="44" rx="6" class="mod"/>
  <text x="774" y="191" class="t" style="font-size:14px">app.js</text>
  <text x="774" y="208" class="xs">経路の振り分け・回数制限・CSP・管理者の認証と権限</text>

  <rect x="760" y="226" width="120" height="50" rx="6" class="mod"/>
  <text x="772" y="246" class="t" style="font-size:13px">service.js</text>
  <text x="772" y="263" class="xs">参加者・冪等</text>
  <rect x="890" y="226" width="120" height="50" rx="6" class="mod"/>
  <text x="902" y="246" class="t" style="font-size:13px">admin.js</text>
  <text x="902" y="263" class="xs">開催回・削除</text>
  <rect x="1020" y="226" width="120" height="50" rx="6" class="mod"/>
  <text x="1032" y="246" class="t" style="font-size:13px">auth.js</text>
  <text x="1032" y="263" class="xs">scrypt・セッション</text>

  <rect x="760" y="286" width="120" height="50" rx="6" class="mod"/>
  <text x="772" y="306" class="t" style="font-size:13px">engine.js</text>
  <text x="772" y="323" class="xs">約定・受渡・評価</text>
  <rect x="890" y="286" width="120" height="50" rx="6" class="mod"/>
  <text x="902" y="306" class="t" style="font-size:13px">dataset.js</text>
  <text x="902" y="323" class="xs">市場データの検証</text>
  <rect x="1020" y="286" width="120" height="50" rx="6" class="mod"/>
  <text x="1032" y="306" class="t" style="font-size:13px">削除ジョブ</text>
  <text x="1032" y="323" class="xs">60秒ごと</text>

  <rect x="760" y="346" width="380" height="34" rx="6" class="mod"/>
  <text x="774" y="368" class="t" style="font-size:13px">db.js</text>
  <text x="824" y="368" class="xs">テーブル定義・移行・トランザクション（BEGIN IMMEDIATE）</text>

  <path d="M720 222 L758 196" class="ln" marker-end="url(#ar)"/>
  <text x="560" y="290" class="xs">→ app.js へ HTTP（127.0.0.1）</text>

  <!-- SQLite -->
  <g transform="translate(860,418)">
    <ellipse cx="90" cy="10" rx="90" ry="12" fill="#fff6e5" stroke="#b7791f" stroke-width="1.4"/>
    <path d="M0 10 L0 70 A90 12 0 0 0 180 70 L180 10" fill="#fff6e5" stroke="#b7791f" stroke-width="1.4"/>
    <ellipse cx="90" cy="10" rx="90" ry="12" fill="none" stroke="#b7791f" stroke-width="1.4"/>
    <text x="90" y="44" text-anchor="middle" class="t">SQLite</text>
    <text x="90" y="62" text-anchor="middle" class="xs">app.sqlite（WAL・1ファイル）</text>
  </g>
  <line x1="950" y1="380" x2="950" y2="414" class="ln" marker-end="url(#ar)"/>

  <rect x="560" y="410" width="270" height="100" rx="8" class="box"/>
  <text x="574" y="432" class="g">データベースの中身</text>
  <text x="574" y="452" class="xs">市場データ（固定後は変更不可・削除しない）</text>
  <text x="574" y="470" class="xs">開催回（管理者が削除するまで残る）</text>
  <text x="574" y="488" class="xs">参加者のデータ（終了の24時間後に自動削除）</text>
  <text x="574" y="504" class="xs">管理アカウント・監査ログ・削除の記録</text>

  <!-- 開発・運用 -->
  <rect x="30" y="555" width="1140" height="200" rx="12" class="grp"/>
  <text x="46" y="578" class="g">開発・運用（説明会の参加者は通らない経路）</text>

  <rect x="48" y="595" width="200" height="86" rx="8" class="box"/>
  <text x="62" y="618" class="t" style="font-size:14px">元のデータと台帳</text>
  <text x="62" y="638" class="xs">market-data/raw/（運用会社のCSV）</text>
  <text x="62" y="654" class="xs">market-data/catalog.json</text>
  <text x="62" y="670" class="xs">出典・ハッシュ・取引条件・ニュース</text>

  <rect x="290" y="595" width="180" height="86" rx="8" class="box"/>
  <text x="304" y="618" class="t" style="font-size:14px">build-dataset.js</text>
  <text x="304" y="638" class="xs">ハッシュの照合</text>
  <text x="304" y="654" class="xs">期間・重複・欠損・禁止語</text>
  <text x="304" y="670" class="xs">の検査</text>

  <rect x="512" y="595" width="180" height="86" rx="8" class="box"/>
  <text x="526" y="618" class="t" style="font-size:14px">dataset.json</text>
  <text x="526" y="638" class="xs">取込ファイル</text>
  <text x="526" y="654" class="xs">（許諾未確認のため</text>
  <text x="526" y="670" class="xs">　リポジトリに入れない）</text>

  <line x1="248" y1="638" x2="288" y2="638" class="ln" marker-end="url(#ar)"/>
  <line x1="470" y1="638" x2="510" y2="638" class="ln" marker-end="url(#ar)"/>
  <path d="M602 595 L602 529" class="ln" marker-end="url(#ar)"/>
  <text x="610" y="544" class="xs">scp で VPS へ転送し、</text><text x="610" y="572" class="xs">seed-staging.js で取込・固定</text>

  <rect x="760" y="595" width="180" height="86" rx="8" class="box"/>
  <text x="774" y="618" class="t" style="font-size:14px">GitHub</text>
  <text x="774" y="638" class="xs">アプリのコード</text>
  <text x="774" y="654" class="xs">（市場データ・秘密情報は</text>
  <text x="774" y="670" class="xs">　含まない）</text>
  <path d="M850 595 L850 529" class="ln" marker-end="url(#ar)"/>
  <text x="858" y="572" class="xs">git pull</text>

  <rect x="980" y="595" width="170" height="86" rx="8" class="box"/>
  <text x="994" y="618" class="t" style="font-size:14px">運用担当</text>
  <text x="994" y="638" class="xs">SSH（鍵認証）</text>
  <text x="994" y="654" class="xs">再起動・更新・アカウント</text>
  <text x="994" y="670" class="xs">admin-user.js / admin-call.js</text>
  <path d="M1065 595 L1065 527" class="ln" marker-end="url(#ar)"/>
  <text x="1072" y="566" class="xs">SSH 22</text>

  <text x="46" y="735" class="xs">実線の矢印: 要求・データの流れ　／　点線: cloudflared が VPS から Cloudflare へ張る外向きの接続　／　緑の枠: 同じ Node.js プロセスの中</text>

  <text x="30" y="785" class="xs">詳しい図（モジュールの依存・要求の順序・データ構造・状態遷移・認証と権限）は docs/ARCHITECTURE.md</text>
</svg>
