<!doctype html>
<html lang="ja">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>管理画面 - 資産形成シミュレーター</title>
<link rel="stylesheet" href="/style.css">
<style>textarea{width:100%;min-height:140px;font-family:monospace;font-size:.85rem;border:1px solid var(--line);border-radius:8px;background:var(--card);color:var(--fg);padding:8px}.row{display:flex;gap:8px;flex-wrap:wrap}.row>*{flex:1 1 200px}pre{white-space:pre-wrap;word-break:break-all;font-size:.8rem}body{padding-bottom:24px}#qrbig{position:fixed;inset:0;z-index:50;background:#fff;color:#111;display:flex;align-items:center;justify-content:center;padding:16px;overflow:auto}.qb-in{text-align:center;width:100%;max-width:720px}.qb-t{font-size:1.5rem;font-weight:700}.qb-h{font-size:1.1rem;margin:6px 0 10px}.qb-q svg{width:min(72vh,92vw);height:auto;max-width:100%}.qb-u{font-family:monospace;font-size:1.15rem;word-break:break-all;margin:10px 0}#qrbig .btns{justify-content:center}@media print{body.qrmode>*:not(#qrbig){display:none!important}.noprint{display:none!important}#qrbig{position:static}}h2.sec{font-size:1.05rem;margin:22px 0 8px}.quick{border:2px solid var(--pri)}.steps3{margin:4px 0 10px;padding-left:1.4em;font-size:.9rem;color:var(--sub)}select{width:100%;padding:12px 14px;font:inherit;font-size:1.05rem;border:1px solid var(--rule-strong);border-radius:8px;background:#fff;color:var(--ink);min-height:52px}.evmeta{display:flex;flex-wrap:wrap;gap:4px 16px;align-items:baseline;margin:4px 0}.evmeta b{font-size:1.15rem}.evmeta span{color:var(--sub);font-size:.86rem}.joinurl code{word-break:break-all}details.adv,details.more{border:1px solid var(--rule);border-radius:8px;padding:0 14px;margin:10px 0;background:#fff}details.more{border:0;padding:0;margin-top:8px}details.more>summary{font-weight:600;font-size:.86rem;color:var(--sub);min-height:40px;padding:8px 0}.qb-n{font-size:1.2rem;font-weight:700;margin:6px 0}main#app{max-width:860px;margin:0 auto;padding:8px 20px 24px}.loginbox{max-width:420px;margin:24px auto}.loginbox .card{padding:20px}</style>
</head>
<body>
<div id="envbanner" hidden></div>
<main id="app"></main>
<script src="/vendor/qrcode.js"></script>
<script src="/admin.js"></script>
</body>
</html>
