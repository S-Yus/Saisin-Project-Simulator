# 確認用環境(staging)と本番(prod)を別コンテナ・別ボリューム・別トークンで動かす例（ビルド未検証）
# 起動: docker compose -f deploy/docker-compose.yml up -d staging
# 停止: docker compose -f deploy/docker-compose.yml stop staging   （SIGTERM → 正常終了）
services:
  staging:
    build: ..
    env_file: ../.env.staging          # APP_ENV=staging, 確認用のトークン（本番と別）
    environment: { HOST: 0.0.0.0, DB_PATH: /data/app.sqlite, TRUST_PROXY: "1" }
    volumes: [ "staging-data:/data" ]
    ports: [ "127.0.0.1:8081:8080" ]   # 外部へは直接公開しない（前段の HTTPS プロキシから接続）
    restart: unless-stopped
    stop_grace_period: 15s
  prod:
    build: ..
    env_file: ../.env.prod             # APP_ENV=prod, 本番のトークン
    environment: { HOST: 0.0.0.0, DB_PATH: /data/app.sqlite, TRUST_PROXY: "1" }
    volumes: [ "prod-data:/data" ]
    ports: [ "127.0.0.1:8082:8080" ]
    restart: unless-stopped
    stop_grace_period: 15s
  # アプリ停止中も期限どおり削除するための独立実行（15分ごと）。同じボリュームを共有する
  prod-purge:
    build: ..
    env_file: ../.env.prod
    environment: { DB_PATH: /data/app.sqlite }
    volumes: [ "prod-data:/data" ]
    entrypoint: [ "sh", "-c", "while true; do node scripts/purge.js; sleep 900; done" ]
    restart: unless-stopped
volumes:
  staging-data: {}
  prod-data: {}
